<svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- 16x24 pixel-art knight, drawn as rects so the source stays tiny and crisp -->
  <!-- plume -->
  <rect x="7" y="0" width="2" height="2" fill="#d64550"/>
  <!-- helmet -->
  <rect x="5" y="2" width="6" height="1" fill="#aab4c4"/>
  <rect x="4" y="3" width="8" height="3" fill="#8b97ab"/>
  <rect x="4" y="5" width="1" height="1" fill="#6d7b8f"/>
  <rect x="11" y="5" width="1" height="1" fill="#6d7b8f"/>
  <!-- face -->
  <rect x="5" y="6" width="6" height="3" fill="#eec39a"/>
  <rect x="6" y="7" width="1" height="1" fill="#2b2118"/>
  <rect x="9" y="7" width="1" height="1" fill="#2b2118"/>
  <!-- tunic -->
  <rect x="4" y="9" width="8" height="6" fill="#3f5e8c"/>
  <rect x="5" y="10" width="1" height="4" fill="#4f70a0"/>
  <!-- shoulder pads -->
  <rect x="3" y="9" width="2" height="2" fill="#8b97ab"/>
  <rect x="11" y="9" width="2" height="2" fill="#8b97ab"/>
  <!-- arms -->
  <rect x="3" y="11" width="2" height="4" fill="#6d7b8f"/>
  <rect x="11" y="11" width="2" height="4" fill="#6d7b8f"/>
  <!-- belt -->
  <rect x="4" y="15" width="8" height="1" fill="#2b2118"/>
  <rect x="7" y="15" width="2" height="1" fill="#e0a83e"/>
  <!-- skirt -->
  <rect x="5" y="16" width="6" height="2" fill="#35507a"/>
  <!-- legs -->
  <rect x="5" y="18" width="2" height="3" fill="#4a3728"/>
  <rect x="9" y="18" width="2" height="3" fill="#4a3728"/>
  <!-- boots -->
  <rect x="4" y="21" width="3" height="2" fill="#2b2118"/>
  <rect x="9" y="21" width="3" height="2" fill="#2b2118"/>
</svg>
