<svg xmlns="http://www.w3.org/2000/svg" width="10" height="22" viewBox="0 0 10 22" shape-rendering="crispEdges">
  <!-- 10x22 pixel-art lantern post; the bright glass texels are picked up by
       the sprite shader's luminance-keyed emission and bloom -->
  <rect x="3" y="0" width="4" height="2" fill="#2f2f38"/>
  <rect x="2" y="2" width="6" height="7" fill="#ffd166"/>
  <rect x="3" y="3" width="4" height="5" fill="#ffe9a8"/>
  <rect x="4" y="4" width="2" height="3" fill="#fff7dc"/>
  <rect x="2" y="9" width="6" height="1" fill="#2f2f38"/>
  <rect x="4" y="10" width="2" height="10" fill="#3a3a44"/>
  <rect x="2" y="20" width="6" height="2" fill="#2f2f38"/>
</svg>
