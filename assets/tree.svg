<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40" shape-rendering="crispEdges">
  <!-- 32x40 pixel-art tree -->
  <!-- trunk -->
  <rect x="14" y="24" width="4" height="14" fill="#5b4232"/>
  <rect x="13" y="24" width="1" height="8" fill="#6f5340"/>
  <rect x="12" y="36" width="8" height="2" fill="#4a3728"/>
  <!-- canopy: dark base -->
  <rect x="4" y="6" width="24" height="18" fill="#24543f"/>
  <rect x="2" y="10" width="28" height="12" fill="#24543f"/>
  <rect x="8" y="2" width="16" height="6" fill="#24543f"/>
  <!-- canopy: mid tone -->
  <rect x="6" y="5" width="20" height="15" fill="#2d6a4f"/>
  <rect x="4" y="9" width="24" height="10" fill="#2d6a4f"/>
  <!-- canopy: lit patches -->
  <rect x="8" y="6" width="9" height="4" fill="#52a675"/>
  <rect x="18" y="10" width="7" height="4" fill="#52a675"/>
  <rect x="6" y="13" width="6" height="4" fill="#52a675"/>
  <!-- canopy: highlights -->
  <rect x="10" y="7" width="4" height="2" fill="#74c69d"/>
  <rect x="20" y="11" width="3" height="2" fill="#74c69d"/>
</svg>
